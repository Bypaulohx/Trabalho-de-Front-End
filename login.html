<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tela de login feita como estudo de front-end.">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="icon" href="assets/images/Logo-icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=New+Amsterdam&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Login — Paulo Henrique</title>
</head>
<body>
    <main class="auth-shell">
        <div class="auth-visual">
            <img src="assets/images/Login.png" alt="Ilustração de uma pessoa usando computador">
            <div class="auth-visual-copy">
                <a class="back-link" href="index.html">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                    Voltar ao portfólio
                </a>
                <h1>Bem-vindo ao <span>&lt;CODE&gt;</span></h1>
                <p>Uma tela de login feita para estudar layout, formulários e validação no navegador.</p>
            </div>
        </div>

        <div class="auth-panel">
            <div class="auth-card">
                <div class="auth-header">
                    <span class="eyebrow">Acesse sua conta</span>
                    <h2>Entrar</h2>
                </div>

                <div class="social-login">
                    <button type="button" class="button button-outline" data-action="social" data-provider="Google">
                        <i class="bi bi-google" aria-hidden="true"></i>
                        Google
                    </button>
                    <button type="button" class="button button-outline" data-action="social" data-provider="Facebook">
                        <i class="bi bi-facebook" aria-hidden="true"></i>
                        Facebook
                    </button>
                </div>

                <div class="separator"><span>ou continue com e-mail</span></div>

                <form class="login-form" id="login-form" novalidate>
                    <div class="field">
                        <label class="sr-only" for="email">Seu e-mail</label>
                        <i class="bi bi-envelope" aria-hidden="true"></i>
                        <input type="email" id="email" name="email" placeholder="example@gmail.com" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label class="sr-only" for="password">Sua senha</label>
                        <i class="bi bi-lock" aria-hidden="true"></i>
                        <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" required minlength="6">
                        <button type="button" class="password-toggle" data-action="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div class="options">
                        <label class="remember">
                            <input type="checkbox" name="remember">
                            Lembrar novamente
                        </label>
                        <button type="button" class="link-button" data-action="forgot">Esqueceu a senha?</button>
                    </div>

                    <button type="submit" class="button button-primary login-button">Entrar</button>
                </form>

                <p class="create-account">
                    Ainda não tem conta?
                    <button type="button" class="link-button" data-action="create-account">Criar agora</button>
                </p>
            </div>
        </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="js/login.js" defer></script>
</body>
</html>
